name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/gemini-web-bridge/package-lock.json
      - run: npm ci --prefix plugins/gemini-web-bridge
      - run: npm run verify
      - name: Verify committed runtime bundle
        run: git diff --exit-code -- plugins/gemini-web-bridge/dist
