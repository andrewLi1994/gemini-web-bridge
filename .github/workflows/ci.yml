name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/gemini-web-bridge/package-lock.json
      - run: npm ci --prefix plugins/gemini-web-bridge
      - run: npm run verify
      - name: Verify committed runtime bundle
        run: git diff --exit-code -- plugins/gemini-web-bridge/dist
